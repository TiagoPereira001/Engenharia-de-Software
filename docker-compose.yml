# Levanta a aplicação inteira com um comando:  docker compose up --build
# Front-end em http://localhost:5173, API em http://localhost:8000/api/
# Os dois contentores ficam na mesma rede; o front-end chega ao back-end pelo nome "backend".

services:
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_DB_PATH: /dados/db.sqlite3
    volumes:
      - dados:/dados
    ports:
      - "8000:8000"
    networks:
      - rede

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rede

networks:
  rede:

volumes:
  dados:
