# Corre as verificações de qualidade e os testes em cada pull request e em cada push para a main (EDS-165).
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      # Estilo e erros comuns do código (regras em backend/pyproject.toml).
      - run: ruff check .
      # Testes com cobertura; falha se a cobertura descer dos 90 %.
      - run: coverage run manage.py test
      - run: coverage report --fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
